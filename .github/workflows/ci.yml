name: ci
on:
  pull_request:
  push:
    branches: [main]

# NOTE: full CI is blocked until @aquascape/{ui,botany} are published to
# GitHub Packages. Those repos' publish.yml push on push-to-main. Once
# they've each succeeded at least once, replace this shape job with the
# real one below.

jobs:
  shape:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Validate package.json
        run: node -e "JSON.parse(require('fs').readFileSync('package.json'))"
      - name: Validate app.json
        run: |
          if [ -f app.json ]; then
            node -e "JSON.parse(require('fs').readFileSync('app.json'))"
          fi
      - name: ok
        run: echo "shape check ok — see ci.yml comments for how to upgrade to full CI"

